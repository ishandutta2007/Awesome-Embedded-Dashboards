<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" rx="16"/>

  <!-- Background Animated Elements (Behind Text) -->
  <!-- Floating Orbs -->
  <circle cx="150" cy="80" r="100" fill="#6366f1" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="80;100;80" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="280" r="120" fill="#ec4899" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="280;260;280" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Data Grid Lines -->
  <g opacity="0.1">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 8"/>
    <path d="M 200 0 L 200 360 M 400 0 L 400 360 M 600 0 L 600 360 M 800 0 L 800 360 M 1000 0 L 1000 360" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 8"/>
  </g>

  <!-- Dynamic Wave Area Chart (Background Decorative Element) -->
  <path d="M0,280 Q 300,200 600,250 T 1200,210 L 1200,360 L 0,360 Z" fill="url(#accent)" opacity="0.08">
    <animate attributeName="d" 
             values="M0,280 Q 300,200 600,250 T 1200,210 L 1200,360 L 0,360 Z;
                     M0,260 Q 300,240 600,210 T 1200,240 L 1200,360 L 0,360 Z;
                     M0,280 Q 300,200 600,250 T 1200,210 L 1200,360 L 0,360 Z" 
             dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)" />

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and contrast) -->

  <!-- Pill Badge Top -->
  <g transform="translate(450, 45)">
    <rect x="0" y="0" width="300" height="32" rx="16" fill="url(#accent)" opacity="0.2"/>
    <rect x="1" y="1" width="298" height="30" rx="15" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="150" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">
      ⚡ ULTIMATE ECOSYSTEM GUIDE
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" text-anchor="middle" fill="#ffffff" letter-spacing="-0.5">
    Awesome Embedded Dashboards
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#94a3b8">
    Curated SaaS Platforms, Open-Source Engines &amp; Developer Tooling
  </text>

  <!-- Highlight Cards Grid (Foreground Decorative Info Chips) -->
  <g transform="translate(210, 220)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="230" height="70" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#818cf8" font-family="sans-serif" font-size="20">📊</text>
    <text x="50" y="30" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Commercial SaaS</text>
    <text x="50" y="50" fill="#94a3b8" font-family="sans-serif" font-size="12">Pricing &amp; Scale Metrics</text>

    <!-- Chip 2 -->
    <rect x="250" y="0" width="230" height="70" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
    <text x="270" y="32" fill="#c084fc" font-family="sans-serif" font-size="20">🔓</text>
    <text x="300" y="30" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Open-Source Engines</text>
    <text x="300" y="50" fill="#94a3b8" font-family="sans-serif" font-size="12">Star-Ranked Libraries</text>

    <!-- Chip 3 -->
    <rect x="500" y="0" width="230" height="70" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
    <text x="520" y="32" fill="#f472b6" font-family="sans-serif" font-size="20">🛠️</text>
    <text x="550" y="30" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Semantic &amp; SDKs</text>
    <text x="550" y="50" fill="#94a3b8" font-family="sans-serif" font-size="12">Cube, Superset, Metabase</text>
  </g>

  <!-- Bottom Accent Dots -->
  <circle cx="580" cy="325" r="4" fill="#6366f1">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="325" r="4" fill="#a855f7">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="325" r="4" fill="#ec4899">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>
